name: "Publish DevContainer Feature"

on:
  push:
    branches:
      - main
    paths:
      - "src/mocc/**"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
          # Publish the feature under a dedicated namespace so its
          # devcontainer-collection.json artifact does not collide with the
          # Docker image at the repo root (ghcr.io/<owner>/mocc). Without this,
          # the collection overwrites the image's `latest` tag and breaks
          # `docker pull` / `docker compose pull`.
          features-namespace: "${{ github.repository_owner }}/mocc-feature"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
