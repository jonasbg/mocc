name: Docker Image CI/CD Build

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only needs to read the repo and push to GHCR.
permissions:
  contents: read
  packages: write

env:
  REPO: ${{ github.repository }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    outputs:
      main_digest: ${{ steps.build-main.outputs.digest }}
      registry: ${{ steps.derive-registry.outputs.registry }}

    steps:
      - name: Derive registry host
        id: derive-registry
        run: |
          set -e
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"

          if [ "$host" = "github.com" ]; then
            registry="ghcr.io"
          else
            registry="$host"
          fi

          # export for steps in this job
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
          # expose as step output for other jobs
          echo "registry=$registry" >> "$GITHUB_OUTPUT"


      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go tests with coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print int($3)}')
          if [ "$pct" -lt 74 ]; then
            echo "::error ::Test coverage $pct% is below required 74% minimum."
            exit 1
          fi
        shell: bash

      # QEMU required for multi-platform builds (e.g. arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
          buildkitd-flags: --debug

      - name: Docker Metadata
        id: meta-main
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
          labels: |
            org.opencontainers.image.title=mocc
            org.opencontainers.image.description=Minimal OpenID Connect (OIDC) mock provider for local development and testing
            org.opencontainers.image.vendor=jonasbg
            org.opencontainers.image.url=https://github.com/jonasbg/mocc
            org.opencontainers.image.documentation=https://github.com/jonasbg/mocc#readme

      # metadata-action always emits licenses= (empty, as the repo has no
      # licence on GitHub) and cannot be told not to; drop empty-valued labels
      # so the image does not carry a blank licenses label.
      - name: Drop empty labels
        id: labels
        env:
          LABELS: ${{ steps.meta-main.outputs.labels }}
        run: |
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "labels<<$delim"
            printf '%s\n' "$LABELS" | grep -v '=$' || true
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Get build date (UTC, RFC 3339)
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push main image
      - name: Build and push image
        uses: docker/build-push-action@v7
        id: build-main
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: |
            MOCC_VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
            VERSION=${{ steps.meta-main.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:cache,mode=max
